[workspace]
resolver = "3"

members = [
  "origami-gallery-slint",
  "origami-kit/config",
  "origami-kit/panes",
  "origami-kit/theme",
  "origami-kit/viewport",
  "origami-slint",
  "origami-slint-build",
]

default-members = ["origami-gallery-slint"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
origami-config = { path = "origami-kit/config" }
origami-panes = { path = "origami-kit/panes" }
origami-theme = { path = "origami-kit/theme" }
origami-viewport = { path = "origami-kit/viewport" }
origami-slint = { path = "origami-slint" }
origami-slint-build = { path = "origami-slint-build" }

#[ Crates.io ]
anyhow = "1"
ash = "0.38"
clap = { version = "4.6", features = ["derive"] }
directories = "6.0"
notify = "8.2"
naga = { version = "30", features = ["wgsl-in", "spv-out"] }
wgpu = { version = "30", default-features = false, features = ["wgsl"] }
wgpu-hal = { version = "30", features = ["vulkan"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
slint = { version = "1.18", default-features = false, features = [
  "backend-winit",
  "renderer-skia",
  "compat-1-2",
  "unstable-wgpu-30",
] }
slint-build = "1.18"
sysinfo = "0.39"
tracy-client = { version = "0.18", default-features = false }
time = "0.3"
trash = "5.2.6"
toml = "0.8"

[workspace]
resolver = "3"

members = [
  "origami",
  "origami-kit/config",
  "origami-gallery",
  "ayame"
]

default-members = ["origami"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
origami = { path = "origami" }
origami-config = { path = "origami-kit/config" }
ayame = { path = "ayame" }
# ayame = { git = "https://github.com/kakusika/ayame" }

#[ Crates.io ]
anyhow = "1"
clap = { version = "4.6", features = ["derive"] }
cxx = "1"
cxx-qt = "0.9"
cxx-qt-lib = "0.9"
cxx-qt-build = "0.9"
directories = "6.0"
notify = "8.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sysinfo = "0.39"
tracy-client = { version = "0.18", default-features = false }
time = "0.3"
toml = "0.8"

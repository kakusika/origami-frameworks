[package]
name = "ayame-icons"
links = "ayame-icons"
version.workspace = true
edition.workspace = true
readme = "README.md"

[features]
default = ["qt-resource"]
# Compiles the vendored SVGs into a Qt resource (`qrc:/cettila/icons/...`)
# via `cxx-qt-build`, which requires Qt at build time. A consumer that
# never touches Qt (e.g. a Slint app) should depend with
# `default-features = false` instead and resolve icons via `vendor_dir()`/
# `MAPPING` (see `src/lib.rs`) -- with this feature off, `build.rs` does
# nothing, no Qt tooling invoked at all.
qt-resource = ["dep:cxx-qt-build", "dep:qt-build-utils"]

[dependencies]

[build-dependencies]
cxx-qt-build = { workspace = true, optional = true }
qt-build-utils = { workspace = true, optional = true }
